global:
  threadmodel:
    fiber:
      - instance_name: fiber_instance
        concurrency_hint: 2
server:
  app: homework
  server: rpc
  service:
    - name: trpc.homework.rpc.Greeter
      protocol: trpc
      network: tcp
      ip: 0.0.0.0
      port: 8000
    - name: trpc.homework.rpc.Calc
      protocol: trpc
      network: tcp
      ip: 0.0.0.0
      port: 8001
plugins:
  log:
    default:
      - name: default
        min_level: 2
        sinks:
          stdout:
            eol: true
            stderr_level: 4
          local_file:
            filename: logs/server-framework.log
