name: trpc-homework
services:
  server:
    image: trpc-homework:1.0
    pull_policy: never
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "./rpc_client", "--client_config=conf/health.yaml", "--healthcheck"]
      interval: 30s
      timeout: 8s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  client:
    image: trpc-homework:1.0
    pull_policy: never
    init: true
    profiles: ["test"]
    depends_on:
      server:
        condition: service_healthy
    command: ["./rpc_client", "--client_config=conf/client.yaml"]
